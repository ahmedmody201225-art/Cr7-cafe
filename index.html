:root{

*{box-sizing:border-box}
body{margin:0;background:var(--bg-grad);background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 8px;flex-wrap:wrap}

.clock{color:var(--muted);font-size:13px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navbg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.on{border-color:var(--run);box-shadow:0 0 0 1px var(--run)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-family:var(--f-display);font-weight:700;font-size:18px}
.badge{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.badge.on{background:var(--run-bg);color:var(--run)}
.badge.d{background:var(--warn-bg);color:var(--warn)}
.timer{font-family:var(--f-display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;text-align:center;letter-spacing:1px}

.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.g{background:var(--run);color:var(--accent-fg);border-color:var(--run)}
html[data-theme="dark"] .btn.g{color:#06210f}

.btn.s{padding:4px 10px;font-size:13px;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);padding:4px 10px;border-radius:99px;font-size:13px}

.cmain .it{font-size:17px}

.cmain{display:grid;gap:10px;min-width:0}

.tbl span{font-weight:600}

.tbl.busy{background:var(--warn-bg)}

input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

.logo{display:block;max-width:100%}

[hidden]{display:none!important}

function legacy(){

let chain=Promise.resolve();
function enqueue(p,op,body){
  pendingN++;updStatus();
  const b=body?clone(body):null;
  chain=chain
    .then(()=>op==='set'?dbx.doc(p).set(b):dbx.doc(p).delete())
    .then(()=>{lastErr=false;},e=>{lastErr=true;if(e&&e.code==='permission-denied'&&!staff)permErr=true;remote[p]='?';})
    .then(()=>{pendingN--;updStatus();if(lastErr)softRender();});
}
function syncOut(){
  const want=desired();
  Object.keys(want).forEach(p=>{if(staff&&p.startsWith('cfg/'))return;const j=canon(want[p]);if(remote[p]!==j){remote[p]=j;enqueue(p,'set',want[p]);}});
  Object.keys(remote).forEach(p=>{if(loaded[p.split('/')[0]]&&!(p in want)){delete remote[p];enqueue(p,'del');}});
}
function save(){
  if(!dbx){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}return;}

}
function applyRemote(k,docs){
  Object.keys(remote).forEach(p=>{if(p.split('/')[0]===k)delete remote[p];});
  docs.forEach(d=>{remote[k+'/'+d.id]=canon(d.data());});
  const data=d=>clone(d.data());
  if(k==='cfg'){const d=docs.find(x=>x.id==='main');if(d){const o=data(d);['rateS','rateD','devices','tables','menu'].forEach(f=>{if(o[f]!==undefined)S[f]=o[f];});}}
  else if(k==='active'){S.active={};docs.forEach(d=>{const o=data(d);if(o.segs&&o.segs.length)S.active[d.id]={segs:o.segs,items:o.items||[],limit:o.limit||0,ack:!!o.ack};});}
  else if(k==='orders'){S.orders={};S.cart=[];docs.forEach(d=>{const items=data(d).items||[];if(d.id==='cafe')S.cart=items;else S.orders[d.id]=items;});}
  else if(k==='sales'){S.sales=docs.map(d=>Object.assign({id:d.id},data(d))).sort((a,b)=>a.ts-b.ts);}
  else if(k==='expenses'){S.expenses=docs.map(d=>Object.assign({id:d.id},data(d))).sort((a,b)=>a.ts-b.ts);}
}
function bind(){
  COLS.forEach(k=>{
    dbx.collection(k).onSnapshot(q=>{
      applyRemote(k,q.docs);loaded[k]=true;fresh[k]=!q.metadata.fromCache;updStatus();softRender();
    },e=>{
      if(staff&&e&&e.code==='permission-denied'&&(k==='sales'||k==='expenses')){loaded[k]=true;fresh[k]=true;updStatus();softRender();return;}
      lastErr=true;if(e&&e.code==='permission-denied')permErr=true;softRender();
    });
  });
}

function doMigrate(){
  const o=legacy();if(!o)return;
  const L=Object.assign(defaults(),o);
  ['rateS','rateD','devices','tables','menu'].forEach(k=>{S[k]=L[k];});
  Object.entries(L.active||{}).forEach(([id,se])=>{if(!S.active[id])S.active[id]=se;});
  Object.entries(L.orders||{}).forEach(([id,l])=>{if(l&&l.length&&!(S.orders[id]&&S.orders[id].length))S.orders[id]=l;});
  if(L.cart&&L.cart.length&&!S.cart.length)S.cart=L.cart;
  const hs=new Set(S.sales.map(s=>s.id));(L.sales||[]).forEach(s=>{if(!hs.has(s.id))S.sales.push(s);});
  const he=new Set(S.expenses.map(s=>s.id));(L.expenses||[]).forEach(x=>{if(!he.has(x.id))S.expenses.push(x);});
  try{localStorage.setItem(MIGRATED,'1');}catch(e){}
  save();render();
}

function fmtH(m){m=Math.round(m);const h=Math.floor(m/60),r=m%60;return (h?h+' ساعة':'')+(h&&r?' و ':'')+(r||!h?r+' دقيقة':'');}
function summarize(day){
  const sales=S.sales.filter(x=>dayKey(x.ts)===day);
  const items={},devs={};let mins=0,ps=0,cf=0,ds=0;
  sales.forEach(x=>{
    ps+=x.timeCost;cf+=itemsTotal(x.items);ds+=(x.disc||0);
    if(x.type==='ps'){mins+=x.mins||0;const d=devs[x.dev]||(devs[x.dev]={mins:0,cost:0});d.mins+=x.mins||0;d.cost+=x.timeCost;}
    x.items.forEach(i=>items[i.name]=(items[i.name]||0)+i.qty);
  });
  const exps=S.expenses.filter(e=>dayKey(e.ts)===day).map(e=>({name:e.name,amount:Math.round(e.amount)}));
  const ex=exps.reduce((a,e)=>a+e.amount,0),total=Math.round(ps+cf-ds);
  return {day,n:sales.length,mins:Math.round(mins),ps:Math.round(ps),cf:Math.round(cf),ds:Math.round(ds),total,ex,exps,net:total-ex,items,devs};
}

['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
function beep(){
  try{unlockAudio();if(actx)[0,0.35,0.7,1.5,1.85,2.2].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=880;g.gain.value=0.15;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+0.25);});}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([300,150,300,150,300]);}catch(e){}
}

}

function tick(){
  const now=Date.now();
  const c=document.getElementById('clock');if(c)c.textContent=new Date(now).toLocaleString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('[data-timer]').forEach(el=>{
    const se=S.active[el.dataset.timer];if(!se)return;
    const e=elapsed(se,now),lim=se.limit||0,rem=lim*60000-e;
    el.textContent=lim>0?(rem>=0?hms(rem):'+'+hms(-rem)):hms(e);
    el.classList.toggle('over',lim>0&&rem<0);
    const lb=document.querySelector('[data-tlabel="'+el.dataset.timer+'"]');
    if(lb)lb.textContent=lim>0?(rem>=0?'متبقي من '+lim+' د':'زيادة عن الوقت'):'وقت اللعب';
  });
  const due=dueSession();
  if(due){
    const key=due.d.id+':'+due.se.limit+':'+due.se.segs[0].from;
    if(!alerted[key]){alerted[key]=true;notify(due.d.name);}
    if(!document.querySelector('[role="alertdialog"]'))render();
    if(now-lastBeep>=4000){lastBeep=now;beep();}
  }
  document.querySelectorAll('[data-tcost]').forEach(el=>{const se=S.active[el.dataset.tcost];if(se)el.textContent=money(timeCost(se,now));});
}

  if(t.id==='hmonth'){histMonth=t.value||dayKey(Date.now()).slice(0,7);render();return;}
  if(t.id==='rday'){reportDay=t.value||dayKey(Date.now());render();return;}
  const f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='onote'){opt.note=t.value;return;}
  if(f==='dnote')return;
  if(f==='cnote'){const l=listFor(selTable),it=l&&l.find(x=>x.id===t.dataset.id);if(it){if(t.value.trim())it.note=t.value.trim();else delete it.note;save();}return;}
  if(f==='dur'){pick[t.dataset.id]=t.value==='c'?'c':+t.value;render();return;}
  if(f==='durc'){pickC[t.dataset.id]=Math.max(0,Math.round(+t.value||0));return;}
  if(f==='rateS'||f==='rateD')S[f]=Math.max(0,+t.value||0);
  else if(f==='dev'){const d=S.devices.find(x=>x.id===t.dataset.id);if(d&&t.value.trim())d.name=t.value.trim();}
  else if(f==='tbl'){const d=S.tables.find(x=>x.id===t.dataset.id);if(d&&t.value.trim())d.name=t.value.trim();}
  else if(f==='mname'){const m=S.menu.find(x=>x.id===t.dataset.id);if(m&&t.value.trim())m.name=t.value.trim();}
  else if(f==='mcat'){const m=S.menu.find(x=>x.id===t.dataset.id);if(m){const v=t.value.trim();if(v)m.cat=v;else delete m.cat;}}
  else if(f==='mprice'){const m=S.menu.find(x=>x.id===t.dataset.id);if(m)m.price=Math.max(0,+t.value||0);}
  save();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='tnum'){
    const id=tblIdFor(t.value),msg=document.getElementById('tmsg');
    if(id){selTable=id;flash='';document.getElementById('cmain').innerHTML=cafeMain();if(msg)msg.textContent=tblName(id);}
    else if(msg)msg.textContent=t.value?'اكتب رقم الترابيزة':'اكتب أي رقم ترابيزة';
    return;
  }
  if(t.id==='msearch'){msq=t.value;const mc=document.getElementById('mcols');if(mc)mc.innerHTML=menuCols(selTable,'dadd',msq);return;}
  if(t.dataset&&t.dataset.f==='cnote'){const l=listFor(selTable),it=l&&l.find(x=>x.id===t.dataset.id);if(it){if(t.value.trim())it.note=t.value.trim();else delete it.note;}return;}
  if(t.dataset&&t.dataset.f==='dnote'){const l=draftOf(selTable).find(x=>x.id===t.dataset.id);if(l){if(t.value.trim())l.note=t.value.trim();else delete l.note;}return;}if(t.dataset&&t.dataset.f==='onote'){opt.note=t.value;return;}if(!inv||(t.id!=='dval'&&t.id!=='dtype'))return;
  if(t.id==='dval')inv.dval=t.value;else inv.dtype=t.value;
  const dd=invDisc();
  document.getElementById('invtot').textContent=money(invSub()-dd);
  document.getElementById('invdiscrow').hidden=!(dd>0);
  document.getElementById('invdisc').textContent='-'+money(dd);
});
document.addEventListener('submit',e=>{
  if(e.target.id==='mvform'){e.preventDefault();const to=tblIdFor(document.getElementById('mvnum').value);if(to&&to!==selTable){moveTable(selTable,to);save();}render();return;}
  if(e.target.id==='tform'){e.preventDefault();const tid=tblIdFor(document.getElementById('tnum').value);if(tid){selTable=tid;flash='';}document.activeElement&&document.activeElement.blur&&document.activeElement.blur();render();return;}
  if(e.target.id==='closeform'){
    e.preventDefault();
    const now=Date.now(),c=summarize(dayKey(now)),cashV=document.getElementById('ccash').value,note=document.getElementById('cnote').value.trim();
    const doc=Object.assign(c,{ts:now,by:((auth.currentUser||{}).email)||'محلي'});
    if(cashV!=='')doc.cash=Math.round(+cashV||0);
    if(note)doc.note=note;
    const id=c.day+'-'+now;
    closings.unshift(Object.assign({id},doc));
    if(dbx)dbx.doc('closings/'+id).set(doc).catch(()=>{closErr=true;softRender();});
    render();return;
  }
  e.preventDefault();
  if(e.target.id==='loginform'){doLogin();return;}
  if(e.target.id==='expform'){S.expenses.push({id:uid(),ts:Date.now(),name:document.getElementById('expn').value.trim(),amount:+document.getElementById('expa').value||0});}
  else if(e.target.id==='menuform'){S.menu.push({id:'m'+uid(),name:document.getElementById('mn').value.trim(),price:+document.getElementById('mp').value||0,...(document.getElementById('mc').value.trim()?{cat:document.getElementById('mc').value.trim()}:{})});}
  save();render();
});
render();
document.addEventListener('focusout',()=>{
  if(!pend)return;
  setTimeout(()=>{const a=document.activeElement;if(pend&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){pend=false;render();}},60);
});
function receiptHTML(s){
  const tot=s.timeCost+itemsTotal(s.items)-(s.disc||0),d=new Date(s.ts);
  const dc=s.disc>0?`<tr><td>خصم</td><td>-${Math.round(s.disc)}</td></tr>`:'';
  const rows=s.items.map(i=>`<tr><td>${esc(i.name)} × ${i.qty}</td><td>${Math.round(i.price*i.qty)}</td></tr>`).join('');
  const ps=s.type==='ps'?`<tr><td>وقت اللعب (${Math.round(s.mins)} د)</td><td>${Math.round(s.timeCost)}</td></tr>`:'';
  return `<div class="rc"><img class="logo" src="${LOGO_MARK}" alt="CR7" style="width:30mm;margin:0 auto 4px"><div class="rm">${d.toLocaleDateString('ar-EG')} · ${timeStr(s.ts)}</div><div class="rm">${esc(s.dev)}${s.id?' · #'+esc(String(s.id).slice(0,5)):''}</div><table>${ps}${rows}${dc}</table><div class="rt"><span>الإجمالي</span><span>${Math.round(tot)} ج.م</span></div><div class="rm">شكرًا لزيارتكم</div></div>`;
}
function closeReceiptHTML(c){
  const its=Object.entries(c.items||{}).sort((a,b)=>b[1]-a[1]),dv=Object.entries(c.devs||{}),d=new Date(c.ts||Date.now());
  const diff=c.cash!=null?c.cash-(c.total-(c.ex||0)):null;
  return `<div class="rc"><img class="logo" src="${LOGO_MARK}" alt="CR7" style="width:30mm;margin:0 auto 4px"><h2>تقفيل يوم</h2><div class="rm">${wdName(c.day)} ${esc(c.day)}</div><div class="rm">طُبع ${d.toLocaleDateString('ar-EG')} ${timeStr(d.getTime())}${c.by?' · '+esc(c.by):''}</div>
  <table><tr><td><b>بلايستيشن</b></td><td><b>${fmtH(c.mins)}</b></td></tr>${dv.map(([n,x])=>`<tr><td>· ${esc(n)}</td><td>${fmtH(x.mins)}</td></tr>`).join('')}${its.map(([n,q])=>`<tr><td>${esc(n)}</td><td><b>${q}</b></td></tr>`).join('')}</table>
  <table><tr><td>بلايستيشن</td><td>${c.ps}</td></tr><tr><td>كافيه</td><td>${c.cf}</td></tr><tr><td>خصومات</td><td>-${c.ds}</td></tr><tr><td>عدد الفواتير</td><td>${c.n}</td></tr>${c.ex?`<tr><td>مصروفات</td><td>-${c.ex}</td></tr>${(c.exps||[]).map(e=>`<tr><td>· ${esc(e.name)}</td><td>${e.amount}</td></tr>`).join('')}`:''}${c.cash!=null?`<tr><td>الموجود في الدرج</td><td>${c.cash}</td></tr><tr><td>الفرق</td><td>${diff>0?'+':''}${diff}</td></tr>`:''}</table>
  <div class="rt"><span>الإجمالي</span><span>${c.total} ج.م</span></div>${c.ex?`<div class="rt"><span>الصافي</span><span>${c.total-c.ex} ج.م</span></div>`:''}${c.note?`<div class="rm">ملاحظة: ${esc(c.note)}</div>`:''}</div>`;
}
function orderHTML(name,list){
  const d=new Date(),n=list.reduce((a,i)=>a+i.qty,0);
  return `<div class="rc"><h2>أوردر</h2><div class="rm" style="font-size:18px"><b>${esc(name)}</b></div><div class="rm">${d.toLocaleDateString('ar-EG')} · ${timeStr(d.getTime())}</div>
  <table>${list.map(i=>`<tr><td style="font-size:16px"><b>${i.qty} ×</b> ${esc(i.name)}${optTxt(i)?`<br><small style="font-size:13px">${esc(optTxt(i))}</small>`:''}</td></tr>`).join('')}</table><div class="rm">${n} صنف</div></div>`;
}

  document.getElementById('receipt').innerHTML=receiptHTML(s);

function makeDb(){return{
  doc:p=>({set:b=>setDoc(doc(fs,p),b),delete:()=>deleteDoc(doc(fs,p))}),
  collection:k=>({onSnapshot:(next,err)=>onSnapshot(collection(fs,k),snap=>next({docs:snap.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:snap.metadata}),err)})
};}
function viewLogin(){return `<div class="card" style="max-width:380px;margin:8vh auto 0"><img class="logo" src="${LOGO}" alt="CR7" style="width:150px;margin:0 auto"><h1 style="text-align:center">كاشير الكافيه</h1><div class="note">سجّل دخول عشان تفتح السيستم.</div>
<form id="loginform" style="display:flex;flex-direction:column;gap:12px"><label>الإيميل<input id="lem" type="email" dir="ltr" autocomplete="username" required></label><label>كلمة السر<input id="lpw" type="password" dir="ltr" autocomplete="current-password" required></label><button class="btn p" type="submit">دخول</button><div class="note" id="lerr" style="color:var(--danger)"></div></form></div>`;}
function doLogin(){
  const em=document.getElementById('lem').value.trim(),pw=document.getElementById('lpw').value,box=document.getElementById('lerr');
  box.textContent='';
  signInWithEmailAndPassword(auth,em,pw).catch(err=>{
    const c=err&&err.code;
    box.textContent=c==='auth/network-request-failed'?'مفيش اتصال بالنت.':c==='auth/too-many-requests'?'محاولات كتير، استنى شوية وحاول تاني.':'الإيميل أو كلمة السر غلط.';
  });
}
let signedIn=false;
onAuthStateChanged(auth,user=>{
  if(user){
    staff=!ADMIN_EMAILS.includes(String(user.email||'').toLowerCase());signedIn=true;dbx=makeDb();mode='db';bind();bindClosings();render();
    setTimeout(()=>{if(!ready()){slow=true;render();}},10000);
  }else{
    if(signedIn){location.reload();return;}
    mode='auth';render();
  }
});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
